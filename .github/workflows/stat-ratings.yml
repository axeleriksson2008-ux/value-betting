name: update-stat-ratings

on:
  schedule:
    - cron: "23 4 * * *"   # every day 04:23 UTC, after the night's results are published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-odds      # same group as the odds collector so commits never collide
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-live.txt
      - run: python -m src.update_stat_ratings
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stat_ratings.json
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Update statistics ratings $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

name: collect-odds

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC); GitHub may start it a few minutes late
  workflow_dispatch:       # "Run workflow" button for a manual run

permissions:
  contents: write          # needed to commit the new snapshots

concurrency:
  group: collect-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-live.txt

      - name: Collect odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.collect

      - name: Update reports
        run: python -m src.live

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/cache data/api_calls.csv reports/live_value.md reports/live_clv.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Collect odds $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
